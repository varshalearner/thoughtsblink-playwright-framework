name: Nightly

on:
  schedule:
    - cron: '30 21 * * *' # 03:00 in India
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  test:
    name: Shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    strategy:
      # One failing shard must not cancel the others: the merged report needs all of them.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      HOME: /root
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      BUYER_EMAIL: ${{ secrets.BUYER_EMAIL }}
      BUYER_PASSWORD: ${{ secrets.BUYER_PASSWORD }}
      ARTIST_EMAIL: ${{ secrets.ARTIST_EMAIL }}
      ARTIST_PASSWORD: ${{ secrets.ARTIST_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Flaky tests are reported, not failed: the nightly run is for finding them.
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  report:
    name: Merge reports
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge into one HTML and one JUnit report
        run: npx playwright merge-reports --reporter html,junit ./all-blob-reports
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/junit.xml
      - uses: actions/upload-artifact@v5
        with:
          name: nightly-report
          path: |
            playwright-report/
            reports/junit.xml
          retention-days: 14
